<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALM Chat</title>
    <link rel="stylesheet" href="static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="new-chat-btn">
                <span>+ New Chat</span>
            </div>
            <div class="history">
                <!-- History items would go here -->
                <div class="history-item">Previous Conversation</div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <h1>SALM Model</h1>
                <span class="status-indicator" id="connection-status">Disconnected</span>
            </div>

            <div class="messages-container" id="messages">
                <div class="message system">
                    <div class="avatar">AI</div>
                    <div class="content">Hello! I am SALM. You can chat with me using text or voice.</div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <input type="file" id="audio-upload" accept="audio/*" style="display: none;">
                    <button id="upload-btn" class="icon-btn" title="Upload Audio">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </button>
                    <button id="mic-btn" class="icon-btn" title="Start Recording">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <textarea id="text-input" placeholder="Send a message..." rows="1"></textarea>
                    <button id="send-btn" class="icon-btn" title="Send Message">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="disclaimer">SALM can make mistakes. Consider checking important information.</div>
            </div>
        </main>
    </div>
    <script src="static/client.js"></script>
</body>

</html>
