############ Model ############
model:
  pretrained_llm: ${oc.env:LLM_MODEL}
  pretrained_asr: ${oc.env:SPEECH_ENCODER_MODEL}
  pretrained_weights: true  # If false → load architecture only
  trust_remote_code: true
  dtype: bf16

  freeze_params:
    # Freeze LLM
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"

    # Freeze perception encoder & preprocessor
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"

  prevent_freeze_params: []

  prompt_format: ${oc.env:PROMPT_FORMAT}
  audio_locator_tag: "<|audio|>"
  token_equivalent_duration: 0.08

  lora:
    task_type: CAUSAL_LM
    r: 128
    target_modules: ["q_proj", "v_proj"] 
    # ["q_proj", "k_proj", "v_proj", "o_proj"]

  perception:
     target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
     output_dim: 2048
     modality_adapter:
       _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
       d_model: 1024

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 500 # 250
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

############ Trainer ############
trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true

  max_epochs: -1
  max_steps: 10_000_000

  limit_train_batches: 250_000
  accumulate_grad_batches: 1
  limit_val_batches: 0.0

  val_check_interval: ${trainer.limit_train_batches}
  num_sanity_val_steps: 1

  sync_batchnorm: true
  log_every_n_steps: 10
  logger: false
  use_distributed_sampler: false
  enable_checkpointing: false

  gradient_clip_val: 1.0

  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true
    #_target_: lightning.pytorch.strategies.ModelParallelStrategy
    #tensor_parallel_size: 4
    #data_parallel_size: 2

############ Data ############
data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: ${model.token_equivalent_duration}

    seed: 42
    shuffle: true
    shard_seed: "randomized"
    text_field: "answer"
    lang_field: target_lang
    use_lhotse: true
    num_workers: 4

    max_duration: 45
    min_tokens: 2
    use_bucketing: false
    use_multimodal_sampling: true
    measure_total_length: true
    batch_size: 1
    #batch_tokens: 2048 #3072
    max_tokens: 3072

    input_cfg:
      # ==========================
      # QA English  
      # ==========================
      - type: group
        tags: {lag: en, pnc: yes, task: qa}
        weight: 0.2
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-context-text-question/en/VoxPopuli-QA/train.jsonl # max_dur=30.00
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.3
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/worstchan--UltraChat-300K-SLAM-Omni/train.jsonl # max_dur=29.99
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/amuvarma--10k-filtered-tune-audio-text_answer/train.jsonl # max_dur=361.18
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/gruhit-patel--alpaca_speech_instruct/train.jsonl # max_dur=105.96
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/liangtianle--science-question/train.jsonl # max_dur=16.92
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/liangtianle--unsafety-question/train.jsonl # max_dur=37.48
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/Menlo--instruction-speech-encodec-v1.5/train.jsonl # max_dur=28.75
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-text-context/en/yijingwu--HeySQuAD_human/train.jsonl # max_dur=26.45
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
      # ==========================
      # ASR French
      # ==========================
      - type: group
        weight: 0.2
        tags: {pnc: yes, task: asr, lang: fr}
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/FLEURS/train.jsonl # max_dur=29.40
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/Multilingual_LibriSpeech/train_recasepunc.jsonl # max_dur=20.00
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/CommonVoice/train.jsonl # max_dur=17.86
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/Yodas/train.jsonl # max_dur=30.00
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/PxSLU/train_recasepunc.jsonl # max_dur=29.95
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/VoxForge/train_recasepunc.jsonl # max_dur=27.12
            audio_locator_tag: ${model.audio_locator_tag}
      # =====================================
      # ASR English
      # =====================================
      - type: group
        weight: 0.2
        tags: {pnc: yes, task: asr, lang: en}
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/en/context/CommonVoice/train.jsonl # max_dur=49.93
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.4
            tags: {lang: en}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/en/context/Yodas/train.jsonl # max_dur=39.98
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.4
            tags: {lang: en}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/en/context/FLEURS/train.jsonl # max_dur=42.36
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
      # ==========================
      # ASR Italian, Spanish, German
      # ==========================
      - type: group
        tags: {lag: multi, pnc: yes, task: asr}
        weight: 0.1
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/it/context/FLEURS/train.jsonl # max_dur=34.20
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.34
            tags: {lang: it}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/es/context/FLEURS/train.jsonl # max_dur=29.22
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.33
            tags: {lang: es}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/de/context/FLEURS/train.jsonl # max_dur=26.76
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.33
            tags: {lang: de}

      # ==========================
      # QA French
      # ==========================
      - type: group
        tags: {lag: fr, pnc: yes, task: qa}
        weight: 0.2
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/fr/CohereLabs--aya_collection/train.jsonl # max_dur=29.48
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/fr/ComparIA/train.jsonl # max_dur=40.00
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/fr/Vigogne--Alpaca/train.jsonl # max_dur=40.71
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-context-text-question/fr/VoxPopuli-QA/train.jsonl # max_dur=30.00
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.3

      # ==========================
      # AST FR→EN
      # ==========================
      - type: group
        tags: {source_lang: fr, target_lang: en, pnc: yes, task: ast}
        weight: 0.1
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/ast/fr-en/context/Multilingual_TEDx/train.jsonl # max_dur=9.70
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.5
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/ast/fr-en/context/CoVoST/train.jsonl # max_dur=388.51
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.5

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: ${model.token_equivalent_duration}

    sample_rate: 16000
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"

    datasets:
      CommonVoice_FR:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: ${oc.env:DATA_FOLDER}/lhotse/asr/fr/CommonVoice/cuts_CommonVoice_casepunc_dev.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Repeat after me, typing in lowercase."
############ Experiment Manager ############
exp_manager:
  exp_dir: null
  name: "SALM-multitasks"

  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: false
  max_time_per_run: "00:19:45:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false

  checkpoint_callback_params:
    filename: "{step:06.0f}"
    monitor: "step"
    mode: "max"
    every_n_train_steps: 1000
    every_n_epochs: null
    save_top_k: -1
    always_save_nemo: false
    save_nemo_on_train_end: false