############ Model ############
model:
  pretrained_llm: "meta-llama/Llama-3.2-1B-Instruct"
  pretrained_asr: ${oc.env:SPEECH_ENCODER_MODEL}
  pretrained_weights: true  # If false → load architecture only

  freeze_params:
    # Freeze LLM
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"

    # Freeze perception encoder & preprocessor
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"

  prevent_freeze_params: []

  prompt_format: llama3
  audio_locator_tag: "<|audio|>"
  token_equivalent_duration: 0.08

  lora:
    task_type: CAUSAL_LM
    r: 128
  #  lora_alpha: 256
  #  lora_dropout: 0.01
  #  target_modules: ["q_proj", "v_proj"] # Light LoRA

  perception:
     target: nemo.collections.speechlm2.modules.perception.AudioPerceptionModule
     output_dim: 2048
     modality_adapter:
       _target_: nemo.collections.speechlm2.modules.perception.IdentityConnector
       d_model: 1024

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-4
    betas: [0.9, 0.98]
    weight_decay: 1e-3
    foreach: true

  lr_scheduler:
    _target_: nemo.core.optim.lr_scheduler.CosineAnnealing
    warmup_steps: 250
    min_lr: 1e-6
    max_steps: ${trainer.max_steps}

############ Trainer ############
trainer:
  devices: -1
  accelerator: gpu
  num_nodes: 1
  precision: bf16-true

  max_epochs: -1
  max_steps: 10_000_000

  limit_train_batches: 250_000
  accumulate_grad_batches: 1
  limit_val_batches: 0.0

  val_check_interval: ${trainer.limit_train_batches}
  num_sanity_val_steps: 1

  sync_batchnorm: true
  log_every_n_steps: 10
  logger: false
  use_distributed_sampler: false
  enable_checkpointing: false

  gradient_clip_val: 1.0

  strategy:
    _target_: lightning.pytorch.strategies.DDPStrategy
    gradient_as_bucket_view: true
    find_unused_parameters: true

############ Data ############
data:
  train_ds:
    sample_rate: 16000
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: ${model.token_equivalent_duration}

    seed: 42
    shuffle: true
    shard_seed: "randomized"
    text_field: "answer"
    lang_field: target_lang
    use_lhotse: true
    num_workers: 4

    max_duration: 60
    min_tokens: 2
    use_bucketing: false
    use_multimodal_sampling: true
    measure_total_length: true
    # batch_size: 4
    batch_tokens: 512 #2048 #3072
    max_tokens: 1024

    input_cfg:

      # ==========================
      # ASR French
      # ==========================
      - type: group
        weight: 0.2
        tags: {pnc: yes, task: asr, lang: fr}
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/FLEURS/manifest_FLEURS_casepunc_train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/Multilingual_LibriSpeech/manifest_Multilingual_LibriSpeech_recasepunc_train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/CommonVoice/manifest_CommonVoice_casepunc_train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/YODAS/manifest_YODAS_casepunc_fr000.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/AfricanAccentedFrench/manifest_AfricanAccentedFrench_recasepunc_max30_train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/LesVocaux/manifest_LesVocaux_recasepunc.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/PxSLU/manifest_PxSLU_recasepunc.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/fr/context/VoxForge/manifest_VoxForge_recasepunc.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
      # =====================================
      # ASR English
      # =====================================
      - type: group
        weight: 0.2
        tags: {pnc: yes, task: asr, lang: en}
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/en/context/CommonVoice/manifest_CommonVoice_casepunc_train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.4
            tags: {lang: en}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/en/context/Yodas/manifest_Yodas.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.4
            tags: {lang: en}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/en/context/FLEURS/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
      # ==========================
      # ASR Italian, Spanish, German
      # ==========================
      - type: group
        tags: {lag: multi, pnc: yes, task: asr}
        weight: 0.1
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/it/context/FLEURS/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.34
            tags: {lang: it}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/es/context/FLEURS/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.33
            tags: {lang: es}
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/asr/de/context/FLEURS/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.33
            tags: {lang: de}

      # ==========================
      # QA French
      # ==========================
      - type: group
        tags: {lag: fr, pnc: yes, task: qa}
        weight: 0.2
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/fr/CohereLabs--aya_collection/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/fr/ComparIA/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/fr/Vigogne--Alpaca/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-context-text-question/fr/VoxPopuli-QA/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.3

      # ==========================
      # QA English  
      # ==========================
      - type: group
        tags: {lag: en, pnc: yes, task: qa}
        weight: 0.2
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-context-text-question/en/VoxPopuli-QA/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.2
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/worstchan--UltraChat-300K-SLAM-Omni/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/amuvarma--10k-filtered-tune-audio-text_answer/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/gruhit-patel--alpaca_speech_instruct/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/liangtianle--science-question/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/liangtianle--unsafety-question/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-only/en/Menlo--instruction-speech-encodec-v1.5/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/question-answering/qa_audio-question-text-context/en/yijingwu--HeySQuAD_human/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.1


      # ==========================
      # AST FR→EN
      # ==========================
      - type: group
        tags: {source_lang: fr, target_lang: en, pnc: yes, task: ast}
        weight: 0.1
        input_cfg:
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/ast/fr-en/CoVoST/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.5
          - type: multimodal_conversation
            manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/multi-turn/ast/fr-en/mTEDx/train.jsonl
            audio_locator_tag: ${model.audio_locator_tag}
            weight: 0.5

  validation_ds:
    prompt_format: ${model.prompt_format}
    token_equivalent_duration: ${model.token_equivalent_duration}

    sample_rate: 16000
    batch_size: 4
    num_workers: 4
    seed: 42
    shard_seed: "randomized"

    datasets:
      CommonVoice_FR:
        input_cfg:
          - type: lhotse_as_conversation
            cuts_path: ${oc.env:DATA_FOLDER}/lhotse/asr/fr/CommonVoice/cuts_CommonVoice_casepunc_dev.jsonl.gz
            audio_locator_tag: ${model.audio_locator_tag}
            tags:
              context: "Repeat after me, typing in lowercase."
############ Experiment Manager ############
exp_manager:
  exp_dir: null
  name: "SpeechLM2-multitasks"

  create_tensorboard_logger: true
  create_checkpoint_callback: true
  use_datetime_version: false
  max_time_per_run: "00:19:45:00"

  resume_from_checkpoint: null
  resume_if_exists: true
  resume_ignore_no_checkpoint: true

  create_wandb_logger: false

  checkpoint_callback_params:
    filename: "{step:06.0f}"
    monitor: "step"
    mode: "max"
    every_n_train_steps: 5000
    every_n_epochs: null
    save_top_k: -1
    always_save_nemo: false
    save_nemo_on_train_end: false