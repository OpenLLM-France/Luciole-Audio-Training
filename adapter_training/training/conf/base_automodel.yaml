# @package _global_
# Automodel "mixin": the additive config shared by every SALMAutomodel run.
# Compose it AFTER /base, e.g.:
#     defaults:
#       - /base
#       - /base_automodel
#       - /recipe: luciole
#       - _self_
#
# Only backend-ADDITIVE fields live here. The two blocks that *conflict* with
# base.yaml's SALM/DDP shape are deliberately NOT here:
#   - trainer.strategy : base.yaml sets DDPStrategy (+ DDP-only kwargs)
#   - model.lora       : base.yaml + recipes set HF-PEFT keys (r, lora_alpha, ...)
# Hydra deep-merges dicts and cannot delete keys, so an overlay can't convert
# either into its Automodel shape. salm_train._normalize_for_automodel() rewrites
# both in code (after config resolution) whenever model.use_nemo_automodel is set.
model:
  use_nemo_automodel: true
  # TransformerEngine 2.6.0 is installed, so TE kernels are used by default.
  # Uncomment to bypass TE (e.g. if te.pytorch fails to load on the GPU node):
  # automodel_backend:
  #   attn: sdpa
  #   linear: torch
  #   rms_norm: torch_fp32
