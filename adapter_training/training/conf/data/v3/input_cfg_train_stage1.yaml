# ============================================================
# STAGE 1 of 3 — ALIGNMENT.
# Train ONLY the adapter; encoder and LLM frozen.
# Recognition-heavy mix: ASR 48%, AST 20%. The adapter learns to
# project audio embeddings into LLM token space using strong
# transcription/translation supervision before the encoder or LLM
# are unfrozen. Inside OTHER (8%), sentence-stress is emphasised
# (prosodic recognition).
# Sum: 48 + 20 + 15 + 8 + 8 + 1 = 100
# ============================================================

# ============================================================
# ASR — 48%
# ============================================================
- type: group
  weight: 0.48
  tags: {task: asr}
  input_cfg:

    # FR — 30% of ASR
    - type: group
      weight: 0.30
      tags: {lang: fr}
      input_cfg:
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/FLEURS/train.jsonl # max_dur=29.40
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/Multilingual_LibriSpeech/train.jsonl # max_dur=20.00
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/CommonVoice/train.jsonl # max_dur=17.86
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/Yodas/train.jsonl # max_dur=30.00
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/PxSLU/train_recasepunc.jsonl # max_dur=29.95
        - type: multimodal_conversation
