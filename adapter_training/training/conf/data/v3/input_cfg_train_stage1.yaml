        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/LVL-Atril-CTFAR/train.jsonl
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/LVL-Atril-CTFNN1/train.jsonl
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/PFC/train.jsonl
        - type: multimodal_conversation
          manifest_filepath: ${oc.env:DATA_FOLDER}/nemo/asr/fr/context/Multilingual_TEDx/train.jsonl
        - type: multimodal_conversation
