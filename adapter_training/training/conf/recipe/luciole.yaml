# @package _global_
# Recipe: LoRA r=64, lr=2e-4, bucketing (26 buckets). Max_tokens=3072, num_workers=3.
model:
  lora:
    r: 64
    lora_alpha: 64
  optimizer:
    lr: 2e-4

trainer:
  max_steps: 600_000
  limit_train_batches: 10_000

data:
  train_ds:
    num_workers: 4
    max_tokens: 3072
    use_bucketing: true
    bucket_duration_bins: [83,100,114,129,148,166,198,222,245,267,290,312,335,369,417,432,449,475,525,574,666,707,732,1024,2048,4096]
    bucket_batch_size: [122,97,86,76,68,59,50,45,40,37,34,32,30,27,24,23,22,21,19,17,15,14,13,4,2,1]
    num_buckets: 26
    bucket_buffer_size: 25000

exp_manager:
  checkpoint_callback_params:
    every_n_train_steps: 5000
