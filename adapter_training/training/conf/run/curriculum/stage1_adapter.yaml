# @package _global_
# ============================================================
# CURRICULUM STAGE 1 of 3 — ALIGNMENT (adapter only).
# EVERYTHING frozen except the modality adapter: LLM, embeddings,
# preprocessor AND the audio encoder are all frozen, and LoRA is
# disabled. Only perception.modality_adapter trains.
# Data: v3 stage-1 recognition-heavy mix (ASR 48%, AST 20%).
#
# Launch (from adapter_training/training/; --data-version overrides input_cfg):
#   python slurm_launcher.py \
#     --config run/curriculum/stage1_adapter \
#     --data-version v3/input_cfg_train_stage1.yaml \
#     --speech-encoder-model "$SCRATCH/speechlm/models/parakeet-tdt-0.6b-v3.nemo" \
#     --job-name luciole_v3_stage1
# ============================================================
defaults:
  - /base
  - /recipe: luciole
  - _self_

model:
  lora: null          # no LoRA — pure adapter alignment
  freeze_params:      # full 4-pattern freeze → only the adapter is trainable
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
    - "^perception\\.preprocessor\\..+$"
    - "^perception\\.encoder\\..+$"
  optimizer:
    lr: 3e-4
  lr_scheduler:
    min_lr: 1e-6

trainer:
  max_steps: 10_000

# Bucketing (bins, max_tokens 15000, max_duration 1200) is inherited from the
# luciole_v3 recipe. Adapter-only fits LARGER batches than the recipe default,
# so override bucket_batch_size with the output of
# curriculum/oomptimizer_stage1_adapter.slurm (27 values):
data:
  train_ds:
    num_buckets: 27
    bucket_duration_bins: [87,105,121,143,171,202,226,249,271,294,319,354,418,433,454,485,521,539,585,633,683,734,966,1545,3426,8832,16384]
    bucket_batch_size: [238,200,173,146,120,104,92,84,76,70,64,59,50,48,46,42,40,38,36,33,30,28,21,13,6,2,1]
#     input_cfg: conf/data/v3/input_cfg_train_stage1.yaml   # or pass via --data-version