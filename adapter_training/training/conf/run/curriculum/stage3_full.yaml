# @package _global_
# ============================================================
# CURRICULUM STAGE 3 of 3 — FULL FINE-TUNE (adapter + encoder + LLM-LoRA).
# Thaw everything: adapter + audio encoder train fully, LLM trains
# via LoRA. No /phase file exists for this stage, so the strategy is
# inlined below (mirrors curriculum_encoder but KEEPS LoRA enabled).
# Encoder: parakeet-tdt-0.6b-v3 with LOCAL attention (passed via
# --speech-encoder-model; rel_pos_local_attn set below).
# Data: v3 stage-3 QA-emphasised mix (QA 38%, ASR floor 25%).
#
# Warm-start = stage 2's LAST checkpoint. Its filename embeds the step
# (e.g. 015000-last.ckpt), so resolve it with a glob and export CHECKPOINT
# BEFORE launching. slurm_launcher.py submits with `sbatch --export=ALL`, so
# the exported var reaches the job, where ${oc.env:CHECKPOINT} below resolves
# it at config load. NOTE: CHECKPOINT is NOT baked into the materialized
# snapshot .slurm (unlike --speech-encoder-model etc.), so re-running that
# snapshot requires re-exporting CHECKPOINT in the submitting shell.
#
# Launch (from adapter_training/training/; --data-version overrides input_cfg):
#   EXP=${EXPERIMENT_FOLDER:-$ALL_CCFRSCRATCH/audio/training/speechlm2_experiments}
#   export CHECKPOINT=$(ls -t "$EXP"/luciole_v3_stage2/checkpoints/*-last.ckpt | head -1)
#   python slurm_launcher.py \
#     --config run/curriculum/stage3_full \
#     --data-version v3/input_cfg_train_stage3.yaml \
#     --speech-encoder-model "$SCRATCH/speechlm/models/parakeet-tdt-0.6b-v3.nemo" \
#     --job-name luciole_v3_stage3
# ============================================================
defaults:
  - /base
  - /recipe: luciole_v3
  - _self_

model:
  init_from_checkpoint: ${oc.env:CHECKPOINT}
  lora:
    r: 64
    lora_alpha: 64
  freeze_params:    # drop "^perception\.encoder\..+$" → encoder trains; LLM frozen except LoRA
    - "^llm\\..+$"
    - "^embed_tokens\\..+$"
    - "^perception\\.preprocessor\\..+$"
  perception:
    encoder:          # parakeet local attention (+/-128 frames each side)
      self_attention_model: rel_pos_local_attn
      att_context_size: [128, 128]
  optimizer:
    lr: 1e-6
  lr_scheduler:
    min_lr: 1e-7

trainer:
  max_steps: 500_000
  limit_train_batches: 100_000

# Bucketing (bins, max_tokens 15000, max_duration 1200) is inherited from the
# luciole_v3 recipe. Encoder unfrozen + LLM-LoRA → the HEAVIEST stage, so it needs
# the SMALLEST batches — override bucket_batch_size with the output of
# curriculum/oomptimizer_stage3_full.slurm (28 values):
# data:
#   train_ds:
#     bucket_batch_size: [...]
#     input_cfg: conf/data/v3/input_cfg_train_stage3.yaml   # or pass via --data-version
