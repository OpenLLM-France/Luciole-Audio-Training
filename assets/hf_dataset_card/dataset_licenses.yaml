datasets:
- name: Common Voice
  match: commonvoice
  license_text: CC0-1.0
  license_audio: CC0-1.0
  redistribute_text: true
  redistribute_audio: true
  audio_source_url: https://commonvoice.mozilla.org/en/datasets
  sources:
  - type: both
    name: Mozilla Common Voice official dataset page
    license: CC0-1.0
    url: https://commonvoice.mozilla.org/en/datasets
  - type: both
    name: Mozilla Common Voice DPG (Digital Public Goods) Profile
    license: CC0-1.0
    url: https://www.digitalpublicgoods.net/r/mozilla-common-voice-dataset
  - type: both
    name: fsicoli/common_voice_22_0 (HuggingFace mirror) — dataset card (secondary)
    license: CC0-1.0 (stated as 'Public Domain, CC-0')
    url: https://huggingface.co/datasets/fsicoli/common_voice_22_0
  - type: both
    name: mozilla-foundation/common_voice_17_0 (HuggingFace — now empty) (legacy tag)
    license: Not visible — repository emptied
    url: https://huggingface.co/datasets/mozilla-foundation/common_voice_17_0
  audited: true
  notes: Audio and text both come from Mozilla Common Voice (cv-corpus 22.0). Only public-domain or CC0-dedicated sentences are accepted, and contributors dedicate their recordings to the public domain, so both layers are CC0-1.0. OpenLLM-France additionally generated automatic speech translation (AST) pairs from these recordings using Qwen3-14B. OpenLLM-France also built the age- and gender-recognition conversations, wrapping Common Voice's own age/gender metadata in instruction prompts and answer phrasings authored by OpenLLM-France.
  curated:
  - task: ast
    kind: text
  - task: age_reco
    kind: text
  - task: gender_reco
    kind: text
  license_discrepancy: 'There is one substantive tension: the CC0-1.0 copyright waiver (irrevocable by the contributors) versus the Mozilla Data Collective Data Consumer Terms of Use (last updated May 6, 2026), which contractually prohibit re-hosting of data downloaded through their platform. These two instruments operate on different legal bases. The CC0 waiver permanently and irrevocably relinquishes copyright — this is explicit in CC0 Section 2 and confirmed by the Creative Commons legal code. The Mozilla Data Collective ToS is a contractual access control that governs how users may use data accessed specifically '
