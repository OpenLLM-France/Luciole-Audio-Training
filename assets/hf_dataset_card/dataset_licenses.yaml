# ============================================================================
# License & redistribution registry for the Luciole Audio Training Dataset.
# Schema per entry: name, match, license_text, license_audio, redistribute_text,
#   redistribute_audio, audio_source_url, sources[] (type, name, license, url),
#   curated (list of {task, kind: audio|text, lang?} rules marking OpenLLM-France-
#   produced task lines; task "*" = whole dataset), audited (bool),
#   license_discrepancy (optional), notes.
# All public strings: concise, no internal paths.
# ============================================================================

