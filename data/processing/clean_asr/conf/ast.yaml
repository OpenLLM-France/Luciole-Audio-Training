# Text cleaning of the translation (AST) manifests: <pair>/context/<Dataset>/ -> <pair>/clean/<Dataset>/, same file names.
#   python data/processing/clean_asr/clean_asr.py data/processing/clean_asr/conf/ast.yaml --datasets fr-en/CoVoST [--dry-run --limit 10000]
# The filters work on the Assistant turn, so they follow the TARGET language of the pair. One output
# per dataset (base: no event tags). The prompts are composed for the pair of the dataset's name (data/contexts/compose_ast_prompts.py).
# No disfluencies nor fix_punctuation: a translation has no hesitations, and its punctuation is not
# a recase model's. No add_final_period on TEDx (subtitle pieces), on Arabic targets (it does not know "؟")
# nor on Portuguese sources (single words, as in pt.yaml). Each dataset lists the filters that change something.

include: [multilang_blocks.yaml]
root: ${DATA_FOLDER}/nemo/ast
prompts: ast
seed: 1234
empty_fraction: 0.0            # a line with no text left has nothing to translate: dropped

tag_tables:
  tedx:                        # the target languages of Multilingual_TEDx: en, es, fr, it, pt
    - {pattern: '\((?:applause|aplausos?|applaudissements|applausi)\)', tags: [applause], ignore_case: true}
    - {pattern: '\((?:laughter|risas?|rires?|risos|risate)\)', tags: [laughter], ignore_case: true}
    - {pattern: '\((?:music|música|musique|musica)\)', tags: [music], ignore_case: true}
    - {pattern: '\((?:inaudible|inaudível|inaudibile)\)', tags: [inaudible], ignore_case: true}

blocks:
  finish_fr:                   # finish, with the French spacing
    - normalize_spacing
    - normalize_punctuation
    - french_typography
  # what a translation model or a translator left in the text: a recopied source, notes, a placeholder
  drop_translation_junk:
    - drop_if_match:
        ignore_case: true
        patterns:
          - '\n'
          - '\*\*'
          - '(?-i:TO REMOVE)'
          - '\[(?:to be removed|to remmove|remove|removed|rejected|blank|missing word|translator''s note[^\]]*|untranslatable[^\]]*)\]'
          - '\((?:note|nota|opmerking|anmerkung)\s*:'
          - 'translated text|texte traduit|vertaalde tekst|übersetzten text|texto traducido|testo tradotto|texto traduzido'
          - '^\s*(?:here is the translation|voici (?:la traduction|le texte traduit))'
  # "[date]", "[distancia]": a number missing from the sentence read, filled in by the translation model
  drop_bracket_placeholders:
    - drop_if_match: {patterns: ['\[[^\[\]]{1,40}\]']}
  # Arabic targets: another script is the model drifting; Latin glued inside an Arabic word too ("كnoxفيل").
  # Latin names stay, "وSteinmuhl" too (no Arabic letter after the name)
  drop_other_scripts_ar:
    - drop_if_match:
        patterns:
          - '[Ѐ-ӿऀ-෿฀-๿぀-ヿ㐀-鿿가-힯]'
          - '[ء-ي][A-Za-z]+[ء-ي]'
  # fr-ar only: the model drifting to Latin in the middle of a word ("لباusanias"); in en-ar, "وcue" is right
  drop_glued_latin_ar:
    - drop_if_match: {patterns: ['[ء-ي][a-z]']}
  tedx_markers:
    - strip_html
    - map_tags: {tables: [tedx]}
    - caption_markers
    - drop_subtitle_debris
    # speakers as initials: "RC: This was", "VV, UM: ..." (speaker_labels needs French word lists)
    - replace:
        rules:
          - {pattern: '(?:^\s*|(?<=[.?!…"»\]])\s+)[A-ZÀ-Þ]{1,3}(?:, [A-ZÀ-Þ]{1,3})* ?: (?=\S)', repl: ' '}

datasets:

  # --- target ar ----------------------------------------------------------------------
  en-ar/CoVoST:
    input: [en-ar/context/CoVoST/train.jsonl, en-ar/context/CoVoST/dev.jsonl, en-ar/context/CoVoST/test.jsonl]
    output: en-ar/clean/CoVoST
    filters: [drop_translation_junk, drop_other_scripts_ar, speech_rate, finish]
  fr-ar/CommonVoiceFR2AR:
    input: [fr-ar/context/CommonVoiceFR2AR/train.jsonl, fr-ar/context/CommonVoiceFR2AR/dev.jsonl, fr-ar/context/CommonVoiceFR2AR/test.jsonl]
    output: fr-ar/clean/CommonVoiceFR2AR
    filters: [drop_translation_junk, drop_bracket_placeholders, drop_other_scripts_ar, drop_glued_latin_ar, speech_rate, finish]

  # --- target de ----------------------------------------------------------------------
  en-de/CoVoST:
    input: [en-de/context/CoVoST/train.jsonl, en-de/context/CoVoST/dev.jsonl, en-de/context/CoVoST/test.jsonl]
    output: en-de/clean/CoVoST
    filters: [drop_translation_junk, drop_other_scripts, add_final_period, speech_rate, finish]
  fr-de/CommonVoiceFR2DE:
