[project]
name = "luciole-audio"
version = "0.1.0"
description = "Scripts to train Audio Adapter models"
readme = "README.md"
license = "GPL-3.0"
authors = []
# The heavy ML extras (TTS, moshi, unsloth, nemo) generally require >=3.10.
# Note: the [tts] extra (coqui TTS 0.22) does not support 3.12 — use 3.10/3.11 if you need it.
requires-python = ">=3.10"

dependencies = [
    "numpy==1.26.4",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "librosa",
    "soundfile",
    "tqdm",
    "loguru",
    "packaging",
]

[project.optional-dependencies]
hf = [
    "transformers==4.43.4",
    "tokenizers==0.19.1",
    "huggingface-hub",
    "datasets",
]
nemo = [
    "nemo-toolkit",
    "omegaconf",
]
# openai-whisper (mel features / encoder) — heavy, only used by a few scripts: opt in explicitly.
# Needed by: data/dataset.py, data/audio_chat_to_dataset.py, data/processing/audio_chuncks_dataset.py
whisper = [
    "openai-whisper @ git+https://github.com/openai/whisper.git",
]

# --- per-subfolder feature extras ---
# data/  (root data-prep scripts)
data = [
    "luciole-audio[hf]",
    "audiomentations==0.34.1",
    "soxbindings",
    "pydub",
    "dask[dataframe]",
    "pandas",
    "pyarrow",
]
# data/generation/
generation = [
    "luciole-audio[hf]",
    "datatrove",
    "faster-whisper",
    "ctranslate2==4.0.0",
]
# data/processing/
processing = [
    "luciole-audio[hf]",
    "luciole-audio[whisper]",
    "lhotse",
    "whisperx",
    "pyarrow",
    "pydub",
    "ssak @ git+https://github.com/linagora-labs/ssak.git",  # used by convert_manifest_to_lhotse.py
]
# data/templating/
templating = [
    "luciole-audio[hf]",
    "pandas",
    "pyarrow",
    "python-slugify",
    "pyyaml",
]
# data/tts/
tts = [
    "luciole-audio[hf]",
    "TTS==0.22.0",
    "moshi==0.2.11",
    "sphn<0.2",
    "parler-tts",
    "nltk",
    "ssak @ git+https://github.com/linagora-labs/ssak.git",  # used by tts_v1.py / tts_kyutai.py
]
# training/
training = [
    "luciole-audio[nemo]",
    "lightning>=2.1.3",
    "pytorch-lightning",
    "tensorboard",
    "bitsandbytes",
    "unsloth",
    "peft",
]
# eval/
eval = [
    "luciole-audio[nemo,hf]",
    "torchmetrics",
    "evaluate",
    "bert-score",
    "flow-judge",
    "whisper-normalizer",
    "lhotse",
]
# export/
export = [
    "luciole-audio[nemo]",
]
# utils/
utils = [
    "luciole-audio[hf]",
    "jiwer",
    "peft",
    "psutil",
    "py3nvml",
    "pandas",
    "pyarrow",
    "audiomentations==0.34.1",
    "soxbindings",
]

# --- convenience bundles ---
all-data = [
    "luciole-audio[data,generation,processing,templating,tts]",
]
all = [
    "luciole-audio[data,generation,processing,templating,tts,training,eval,export,utils]",
]

[dependency-groups]
dev = [
    "ruff>=0.1.11",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The business folders live at the repo root (training/, data/, eval/, export/, utils/) but are
# published as subpackages of the `luciole_audio` implicit namespace package, so the import path is
# `from luciole_audio.data import dataset`, `from luciole_audio.utils.audio import ...`, etc.
#
# `packages` / `package-dir` are enumerated explicitly: automatic discovery cannot express this
# "add a prefix" rewrite. When you add a new subpackage (a folder with an __init__.py under one of
# the roots above), add it to BOTH tables below.
#
# Note: hatchling cannot do this — it rejects prefix-adding `sources` rewrites in editable mode
# (see pfmoore/editables#20), hence setuptools.
[tool.setuptools]
packages = [
    "luciole_audio.training",
    "luciole_audio.data",
    "luciole_audio.data.convert",
    "luciole_audio.data.generation",
    "luciole_audio.data.processing",
    "luciole_audio.data.templating",
    "luciole_audio.data.tts",
    "luciole_audio.eval",
    "luciole_audio.export",
    "luciole_audio.utils",
    "luciole_audio.utils.infer_models",
]

[tool.setuptools.package-dir]
"luciole_audio.training" = "training"
"luciole_audio.data" = "data"
"luciole_audio.data.convert" = "data/convert"
"luciole_audio.data.generation" = "data/generation"
"luciole_audio.data.processing" = "data/processing"
"luciole_audio.data.templating" = "data/templating"
"luciole_audio.data.tts" = "data/tts"
"luciole_audio.eval" = "eval"
"luciole_audio.export" = "export"
"luciole_audio.utils" = "utils"
"luciole_audio.utils.infer_models" = "utils/infer_models"

# Hydra configs (training/conf, eval/conf, export/conf), prompt templates (data/assets) and the
# slurm templates resolved by slurm_launcher.py must ship with the wheel.
[tool.setuptools.package-data]
"*" = ["**/*.yaml", "**/*.yml", "**/*.txt", "**/*.slurm", "**/*.sh"]

[tool.ruff]
line-length = 120 # Allow lines to be as long as 120.
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "C408",
    "B023",
    "C901", # C901 `...` is too complex
    "C417"  # C417 Unnecessary `map` usage (rewrite using a generator expression)
]

[tool.ruff.isort]
known-first-party = ["luciole_audio"]
