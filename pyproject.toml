[project]
name = "audio-adapter-training"
version = "0.1.0"
description = "Scripts to train Audio Adapter models"
readme = "README.md"
license = "GPL-3.0"
authors = []
# The heavy ML extras (TTS, moshi, unsloth, nemo) generally require >=3.10.
# Note: the [tts] extra (coqui TTS 0.22) does not support 3.12 — use 3.10/3.11 if you need it.
requires-python = ">=3.10"

dependencies = [
    "numpy==1.26.4",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "librosa",
    "soundfile",
    "tqdm",
    "loguru",
    "packaging",
]

[project.optional-dependencies]
hf = [
    "transformers==4.43.4",
    "tokenizers==0.19.1",
    "huggingface-hub",
    "datasets",
]
nemo = [
    "nemo-toolkit",
    "omegaconf",
]
# openai-whisper (mel features / encoder) — heavy, only used by a few scripts: opt in explicitly.
# Needed by: data/dataset.py, data/audio_chat_to_dataset.py, data/processing/audio_chuncks_dataset.py
whisper = [
    "openai-whisper @ git+https://github.com/openai/whisper.git",
]

# --- per-subfolder feature extras ---
# adapter_training/data/  (root data-prep scripts)
data = [
    "audio-adapter-training[hf]",
    "audiomentations==0.34.1",
    "soxbindings",
    "pydub",
    "dask[dataframe]",
    "pandas",
    "pyarrow",
]
# adapter_training/data/generation/
generation = [
    "audio-adapter-training[hf]",
    "datatrove",
    "faster-whisper",
    "ctranslate2==4.0.0",
]
# adapter_training/data/processing/
processing = [
    "audio-adapter-training[hf]",
    "audio-adapter-training[whisper]",
    "lhotse",
    "whisperx",
    "pyarrow",
    "pydub",
    "ssak @ git+https://github.com/linagora-labs/ssak.git",  # used by convert_manifest_to_lhotse.py
]
# adapter_training/data/templating/
templating = [
    "audio-adapter-training[hf]",
    "pandas",
    "pyarrow",
    "python-slugify",
    "pyyaml",
]
# adapter_training/data/tts/
tts = [
    "audio-adapter-training[hf]",
    "TTS==0.22.0",
    "moshi==0.2.11",
    "sphn<0.2",
    "parler-tts",
    "nltk",
    "ssak @ git+https://github.com/linagora-labs/ssak.git",  # used by tts_v1.py / tts_kyutai.py
]
# adapter_training/training/
training = [
    "audio-adapter-training[nemo]",
    "lightning>=2.1.3",
    "pytorch-lightning",
    "tensorboard",
    "bitsandbytes",
    "unsloth",
    "peft",
]
# adapter_training/eval/
eval = [
    "audio-adapter-training[nemo,hf]",
    "torchmetrics",
    "evaluate",
    "bert-score",
    "flow-judge",
    "whisper-normalizer",
    "lhotse",
]
# adapter_training/export/
export = [
    "audio-adapter-training[nemo]",
]
# adapter_training/utils/
utils = [
    "audio-adapter-training[hf]",
    "jiwer",
    "peft",
    "psutil",
    "py3nvml",
    "pandas",
    "pyarrow",
    "audiomentations==0.34.1",
    "soxbindings",
]

# --- convenience bundles ---
all-data = [
    "audio-adapter-training[data,generation,processing,templating,tts]",
]
all = [
    "audio-adapter-training[data,generation,processing,templating,tts,training,eval,export,utils]",
]

[dependency-groups]
dev = [
    "ruff>=0.1.11",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapter_training"]

[tool.ruff]
line-length = 120 # Allow lines to be as long as 120.
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "C408",
    "B023",
    "C901", # C901 `...` is too complex
    "C417"  # C417 Unnecessary `map` usage (rewrite using a generator expression)
]
