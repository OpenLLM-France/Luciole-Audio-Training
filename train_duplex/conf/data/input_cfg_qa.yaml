# clean/ VERSION of input_cfg_qa.yaml (2026-11-19): the ASR and AST manifests are the word-aligned
# copies of the cleaned BASE manifests (audio/nemo/<task>/<lang>/clean/, as in v5_transcribe), under
# audio/duplex/nemo/.../clean/ (alignment/align_asr.slurm SET=clean and SET=clean_spont, join_ast_words.slurm
# VARIANT=clean). Base only: no events tags, hesitations removed by the disfluency detector, so the
# spontaneous sets are no longer verbatim and the ASR head learns a single style. CFPP2000 is back.
# QA unchanged. Weights as in the context/ mix: the clean/ alignment keeps nearly the same lines (within 4 %).
# Small duplex test mix: 17 v4 SALM manifests (fr + en; QA, ASR, AST), read as "listen, then answer"
# duplex examples by the `conversation_as_duplex` parser (NeMo fork, branch luciole_duplexstt_3.1):
# instruction text -> system prompt, audio -> user turn, answer -> agent turn right after the audio,
# multi-turn conversations as several exchanges on one timeline.
# Weights sized for a 50k-step run (~4.5 M examples at batch_duration 480 on 4 GPUs, from the dataloader state
# of duplex_2heads_25k_4gpu: 1.86 M examples in 25k steps; dataloader_report.py) so that no dataset is seen more
# than ~3 times. Shares of examples: QA 21 %, ASR 53 %, AST 26 %. QA is capped by its data (325k usable lines,
# 2.9 passes at 50k); ASR and AST are split 50/50 between French and English, ~0.6-1.5 passes.
# Adding a dataset: QA -> weight = its usable lines in thousands (lines kept by conversation_as_duplex, see
# below); then re-check the passes (QA share x 4.5 M / QA usable lines <= 3), raising the QA group weight.
# ASR: the word-aligned copies under audio/duplex/nemo (train_duplex/alignment/align_asr.slurm), same
# lines as audio/nemo minus ~2.4 % dropped, plus `custom.user_words` for the ASR head. MLS fr is the
# recasepunc version: the lowercase one's instructions all ask for no case and no punctuation.
- type: group
  weight: 0.21
  input_cfg:
  # Weights = usable lines in thousands (equal passes over every QA dataset).
  # QA: copies with `custom.user_words`, pseudo-transcripts of the spoken questions by the CTC hybrid
  # FastConformers (alignment/transcribe_qa.slurm); every line kept. SLUE excepted (see below).
  # QA fr
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/question-answering/qa_audio-question-only/fr/Vigogne--Alpaca/train_randomorder_shards/train_randomorder__OP_0..9_CL_.jsonl
    weight: 49.5
  - type: conversation_as_duplex
    manifest_filepath: ${oc.env:DATA_FOLDER}/duplex/nemo/question-answering/qa_audio-question-only/fr/ComparIA/train_randomorder.jsonl
    # 12.9k lines, 56 % dropped: first answer over max_agent_tokens (400; median 447 tokens).
    weight: 5.7
  # QA en (UltraChat and HeySQuAD are mostly multi-turn: several exchanges on one timeline)
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/question-answering/qa_audio-question-only/en/gruhit-patel--alpaca_speech_instruct/train_randomorder_shards/train_randomorder__OP_0..10_CL_.jsonl
    weight: 49.3  # 51.8k lines, 4.7 % over max_agent_tokens
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/question-answering/qa_audio-question-only/en/worstchan--UltraChat-300K-SLAM-Omni/train_randomorder_shards/train_randomorder__OP_0..32_CL_.jsonl
    weight: 164.5
  # Text passage (-> system prompt) + several spoken questions, each answered.
  - type: conversation_as_duplex
    manifest_filepath: ${oc.env:DATA_FOLDER}/duplex/nemo/question-answering/qa_audio-question-text-context/en/yijingwu--HeySQuAD_human/train_randomorder.jsonl
    asr_loss: false  # human voices: pseudo-transcripts too noisy (kept as ASR channel input only)
    weight: 10.8
  # Spoken question + spoken document (one user turn), then the answer. Reference transcripts on both turns
  # (alignment/slue_sqa5_gold.py): the document words and timestamps shipped with SLUE, the question text
  # force-aligned by our CTC aligner; 158 of 46186 lines dropped (question audio not matching its text).
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/question-answering/qa_audio-question-audio-context/en/slue-phase-2-sqa5/train_randomorder_shards/train_randomorder__OP_0..9_CL_.jsonl
    weight: 46.0
- type: group
  weight: 0.53
  input_cfg:
  # 50 % fr / 50 % en. en: proportional to the lines (1106k CV en, 179k VoxPopuli en). fr: 65 % read speech
  # proportional to the lines (581k CV fr, 248k MLS, 71k VoxPopuli fr), 35 % spontaneous speech (see below).
  # ASR fr
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/CommonVoice/train_shards/train__OP_0..118_CL_.jsonl
    asr_only: true  # transcript for the ASR head; no prompt, no agent turn
    agent_loss: false  # silence here would contradict the QA without system prompt (UltraChat, SLUE)
    weight: 0.210
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/Multilingual_LibriSpeech_recasepunc/train_recasepunc_shards/train_recasepunc__OP_0..49_CL_.jsonl
    asr_only: true  # transcript for the ASR head; no prompt, no agent turn
    agent_loss: false  # silence here would contradict the QA without system prompt (UltraChat, SLUE)
    weight: 0.090
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/VoxPopuli/train_shards/train__OP_0..14_CL_.jsonl
    asr_only: true  # transcript for the ASR head; no prompt, no agent turn
    agent_loss: false  # silence here would contradict the QA without system prompt (UltraChat, SLUE)
    weight: 0.025
  # Spontaneous French (interviews, conversations), clean/ base: hesitations removed by the disfluency
  # detector (a few remain: ~6 % of the ESLO lines still have an "euh"), no annotation tags. Aligned with
  # --max-wer 0.8 (align_asr.slurm SET=clean_spont): human references, the greedy CTC errs on 1-3 word
  # segments and now writes hesitations absent from the reference. Shares by kept hours (context/ alignment).
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/ESLO/train_recasepunc_shards/train_recasepunc__OP_0..83_CL_.jsonl
    asr_only: true
    agent_loss: false
    weight: 0.110  # 324k lines kept of 416k (clean/), 2.2 s segments
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/LVL-Atril-CTFAR/train_shards/train__OP_0..11_CL_.jsonl
    asr_only: true
    agent_loss: false
    weight: 0.032  # 39k of 56k (clean/)
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/LVL-Atril-CTFNN1/train_shards/train__OP_0..13_CL_.jsonl
    asr_only: true
    agent_loss: false
    weight: 0.017  # 49k of 69k (clean/)
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/CFPP2000/train_recasepunc_shards/train_recasepunc__OP_0..5_CL_.jsonl
    asr_only: true
    agent_loss: false
    weight: 0.016  # 22k of 28k (clean/); back with clean/, which has no annotation tags
  # ASR en
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/en/clean/CommonVoice/train_shards/train__OP_0..227_CL_.jsonl
    asr_only: true  # transcript for the ASR head; no prompt, no agent turn
    agent_loss: false  # silence here would contradict the QA without system prompt (UltraChat, SLUE)
    weight: 0.430
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/en/clean/VoxPopuli/train_shards/train__OP_0..36_CL_.jsonl
    asr_only: true  # transcript for the ASR head; no prompt, no agent turn
    agent_loss: false  # silence here would contradict the QA without system prompt (UltraChat, SLUE)
    weight: 0.070
- type: group
  weight: 0.26
  input_cfg:
  # AST fr -> en, en -> fr: CommonVoice clips, with the `user_words` of the CV alignment copied over
  # (alignment/join_ast_words.slurm, ~97 % of the lines). CommonVoiceFR2EN rather than CoVoST: 40 % of
  # CoVoST's clips are outside CV train, hence unaligned.
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/ast/fr-en/clean/CommonVoiceFR2EN/train_shards/train__OP_0..118_CL_.jsonl
    weight: 0.5
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/ast/en-fr/clean/CommonVoiceEN2FR/train_shards/train__OP_0..227_CL_.jsonl
    weight: 0.5
