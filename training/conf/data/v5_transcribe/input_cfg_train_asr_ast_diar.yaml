# ============================================================
# WEIGHT RULES inside a dataset (ASR)
# - events / disfluencies / events_disfluencies variants: 25% each, the
#   base takes the rest (3 variants + biasing: base 22%).
# - negative examples (read speech, e.g. CommonVoice: the prompt asks for
#   markers, the audio has none): not used for now, the variants of
#   spontaneous speech already have many lines without markers.
# - contextual biasing variant: 3% (ASR), 1% (AST).
# - silence lines (gaps of long recordings, build_silence.py; fr datasets
#   with >= 100 lines, and Yodas2 in every language): 1% each, events
#   version ([silence] kept) and base version (tag stripped, longer audio).
#   Few draws on purpose: there are few lines anyway (but Yodas2 en).
# - recasepunc and non-recasepunc versions of the same data: equal weights.
# A dataset group competes with its siblings like its base manifest
# (size**(1/T), assets/suggest_yaml_cfg.py), so dataset / language shares
# do not depend on its variants.
# ============================================================

# ============================================================
# v4 — ASR / AST / diarization only   (Luciole-Audio-1.0-ASR)
# Speech-recognition profile cut from v4/input_cfg_train.yaml: the ASR and
# AST buckets are kept as is (same datasets, same language split), every
# QA / AQA / OTHER bucket is dropped, and diarization becomes a
# bucket of its own. CVMultiTurn (transcription / translation chains) comes
# in its asr_ast form, without the accent / gender / age follow-ups, and
# VoxCeleb chat (same speaker or not?) stays as a small speaker bucket.
# A 2% text-only bucket (v4 had 1%) keeps the LLM's text chat ability.
# Sum: 65 + 25 + 2 + 5 + 1 + 2 = 100
# Audio: ~135 663 h in all (per-manifest hours / max_dur from v4/metadata.csv;
# CVMultiTurn/mixed_asr_ast is not in it, measured on JZ over every audio turn).
# ============================================================

# ============================================================
