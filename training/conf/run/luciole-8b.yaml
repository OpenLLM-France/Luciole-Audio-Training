# @package _global_
defaults:
  - /base
  - /base_automodel
  - /recipe: luciole-8b
  - _self_

model:
  automodel_parallel:
    # Full FSDP2 shard, no replication — the v3 setting. dp_replicate_size=2 (v1/v2)
    # keeps the full model on every GPU and only pays off for short-sequence recipes;
    # this one is long-context, so activations are the wall. See run/xp/automodel_8b.yaml
    # for the context-parallel escape hatch if the 16k buckets ever OOM.
    dp_replicate_size: 1
    activation_checkpointing_llm: true

trainer:
  max_steps: 100_000

exp_manager:
  checkpoint_callback_params:
    every_n_train_steps: 10000
