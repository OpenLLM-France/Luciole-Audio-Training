# Luciole-Audio-Transcribe streaming (conf/duplex_transcribe.yaml, single head): streaming ASR and AST, the
# v5_transcribe logic. Every line keeps its instruction (system prompt: task, case / punctuation style, target
# language) and the agent writes the answer WHILE the user speaks (`data.agent_timing: simultaneous` of
# conf/duplex_transcribe.yaml): transcription words from their end + lag, translation words in proportion to the
# source words heard + wait_words.
# Data: the word-aligned copies of the clean/ BASE manifests under audio/duplex/nemo/.../clean/
# (tmp_alignment/align_asr.slurm SET=clean, SET=clean_mls_lower for MLS fr, join_ast_words.slurm VARIANT=clean):
# no events tags, no hesitations.
# Read speech only: the spontaneous sets (ESLO, CFPP2000, LVL-Atril CTFAR / CTFNN1, aligned by SET=clean_spont)
# are left out, half of their segments last under 2 s (too short for streaming) and their alignment is loose
# (align_wer ~0.30 against ~0.05).
# Not yet: events / disfluencies / contextual biasing / numbers variants (their texts are not aligned),
# other AST pairs (no word timestamps for their source), diarization (not streamable as is).
# Shares as v5_transcribe without diarization and text: ASR 70 % / AST 30 %; inside ASR, fr / en 50/50 (the
# weights of input_cfg_qa.yaml for the read sets, fr scaled to keep the language balance).
- type: group
  weight: 0.70
  tags: {task: asr}
  input_cfg:
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/CommonVoice/train_shards/train__OP_0..118_CL_.jsonl
    weight: 0.323
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/Multilingual_LibriSpeech/train_shards/train__OP_0..49_CL_.jsonl
    weight: 0.139
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/fr/clean/VoxPopuli/train_shards/train__OP_0..14_CL_.jsonl
    weight: 0.038
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/en/clean/CommonVoice/train_shards/train__OP_0..227_CL_.jsonl
    weight: 0.430
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/asr/en/clean/VoxPopuli/train_shards/train__OP_0..36_CL_.jsonl
    weight: 0.070
- type: group
  weight: 0.30
  tags: {task: ast}
  input_cfg:
  # CommonVoice clips, with the `user_words` of the CV alignment copied over (~97 % of the lines; the others,
  # without word timestamps, are dropped by the simultaneous timing).
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/ast/fr-en/clean/CommonVoiceFR2EN/train_shards/train__OP_0..118_CL_.jsonl
    weight: 0.5
  - type: conversation_as_duplex
    manifest_filepath: /lustre/fsn1/projects/rech/qgz/commun/audio/duplex/nemo/ast/en-fr/clean/CommonVoiceEN2FR/train_shards/train__OP_0..227_CL_.jsonl
    weight: 0.5
